         <div class="inputs">
            <p style="font-size: 1.3rem;">USER : <span id="user_inp">  </span></p>
            <p style="font-size: 1.3rem;">COMPUTER : <span id="comp_inp"> </span></p>
         </div>
          <p id="result" style="font-size: 2rem; color: #fff; text-shadow: 0px 10px 5px black; font-weight: bolder;"></p>
          <p id="message" style="font-size: 2rem; color: #fff; text-shadow: 0px 10px 5px black; font-weight: bolder;"></p>
          <div class="score">
            <button id="resetbtn" onclick="resetgame()" style="font-size: 1.2rem;">Reset</button>
            <p style="font-size: 1.3rem; color:#fff; font-weight: bolder;">YOUR_SCORE : <span id="user_score">0</span></p>
            <p style="font-size: 1.3rem; color:#fff; font-weight: bolder;">COMPUTER_SCORE : <span id="comp_score">0</span></p>
          </div>
    </div>
   </main>
   <!--javascript-->
   <script>
    //variables that store the score 
    let userscore=0;
    let compscore=0;
    //function to insert user and computer inputs
    function choose(user_choice){            //the parameter indicates the real user choice or inputs
        if(userscore>=10 || compscore>=10)return; // stop the game if someone already won the game.
        const choices=["stone","paper","sessior"];          // this is an array and it indicates that computer has 3 choices 
        const comp_choice = choices[Math.floor(Math.random()*3)];        //compute take 3 choice randomly form the vairable(choices).
        let result="";            //show the result like you loss or win.

        if(user_choice===comp_choice){  //condition match draw
            result="Its a Draw!";
        }
        else if(user_choice==="stone" && comp_choice==="sessior" || user_choice==="paper" && comp_choice==="stone" || user_choice==="sessior" && comp_choice==="paper"){  //condition match winn
            userscore++;
            result="YOU WIN!";
            document.getElementById('message').innerHTML=`${user_choice} beats ${comp_choice}`;
        }
        else{                      //default condition to match loss
            compscore++;
             result="YOU LOSS!";
             document.getElementById('message').innerHTML=`${comp_choice} beats ${user_choice}`;    
        }
        document.getElementById("user_inp").innerHTML=user_choice; //display the user choice(stone paper sessior in the user:_)
        document.getElementById("comp_inp").innerHTML=comp_choice; //display the computer choice(stone paper sessior int the computer :_)
        document.getElementById("result").innerHTML=result;  //display the result (you winn or you loss)
        updatedisplayscore();
        checkwinner();
    }
    //function to updatedisplay score   
    function updatedisplayscore(){
        document.getElementById('user_score').innerHTML=userscore;
        document.getElementById('comp_score').innerHTML=compscore;
    }
     //function to check winners
     function checkwinner(){
        if(userscore===10){
            document.getElementById("message").innerHTML="🎉 You wins the match!";
            document.getElementById("resetbtn").style.display="block";
        }else if(compscore===10){
            document.getElementById("message").innerHTML="🎉 Computer wins the match!";
            document.getElementById('resetbtn').style.display="block";
        }
     }

     //function to reset the game
     function resetgame(){
        userscore=0;
        compscore=0;
        document.getElementById("result").innerHTML="";
        document.getElementById("message").innerHTML="";
        document.getElementById("resetbtn").style.display="block";
        updatedisplayscore();
     }
   </script>
